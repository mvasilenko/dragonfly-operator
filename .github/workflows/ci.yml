name: CI

on:
  # push:
  # branches: [ main ]
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - v*

jobs:
  build-operator:
    runs-on: ubuntu-latest
    env:
      IMG: ghcr.io/mvasilenko/dragonfly-operator:${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Docker Build
        run: |
          make docker-build

      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: kind
          config: ./hack/kind-config.yaml
      - name: Run tests
        timeout-minutes: 16
        run: |
          make docker-kind-load
          make deploy
          make test

      - name: Cleanup
        run: |
          make undeploy

  release-operator:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    needs: build-operator
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    env:
      IMG: ghcr.io/mvasilenko/dragonfly-operator:${{ github.ref_name }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Build
        run: |
          make build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github container repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install helm
        uses: azure/setup-helm@v5

      - name: Push Helm chart as OCI to Github
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          helm registry login -u ${{ github.actor }} --password-stdin ghcr.io

          helm package charts/dragonfly-operator

          helm push dragonfly-operator-${{ env.VERSION }}.tgz oci://ghcr.io/mvasilenko/dragonfly-operator/helm

      - name: Push Helm chart as OCI to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          helm registry login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin docker.io

          helm push dragonfly-operator-${{ env.VERSION }}.tgz oci://docker.io/mvasilenko

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Publish image into GHCR and Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/mvasilenko/dragonfly-operator:${{ github.ref_name }}
            docker.io/mvasilenko/dragonfly-operator:${{ github.ref_name }}
          platforms: |
            linux/amd64
            linux/arm64
        env:
          DOCKER_BUILDKIT: 1

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./bin/dragonfly-operator
            LICENSE
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            Docker image (GHCR): ghcr.io/mvasilenko/dragonfly-operator:${{ github.ref_name }}
            Docker image (Docker Hub): docker.io/mvasilenko/dragonfly-operator:${{ github.ref_name }}
            Helm chart (GHCR): oci://ghcr.io/mvasilenko/dragonfly-operator/helm
            Helm chart (Docker Hub): oci://docker.io/mvasilenko/dragonfly-operator
          draft: true
